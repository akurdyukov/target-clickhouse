[project]
name = "akurdyukov-target-clickhouse"
description = "`target-clickhouse` is a Singer target for clickhouse, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Ben Theunissen" }]
keywords = [
    "ELT",
    "clickhouse",
]
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
# The version is set from the git tag at release time (poetry-dynamic-versioning,
# see release_workflow.yml), so it stays in [tool.poetry]. The dependencies are
# in [tool.poetry.dependencies] as well.
dynamic = ["version", "dependencies"]

[project.urls]
Repository = "https://github.com/akurdyukov/target-clickhouse"
Issues = "https://github.com/akurdyukov/target-clickhouse/issues"

[project.scripts]
target-clickhouse = "target_clickhouse.target:TargetClickhouse.cli"

[tool.poetry]
version = "0.2.5"
packages = [
    { include = "target_clickhouse" },
]

[tool.poetry.dependencies]
singer-sdk = { version=">=0.54,<0.55" }
# 0.3.2 is the first release with the Date32 type.
clickhouse-sqlalchemy = ">=0.3.2,<0.4"

simplejson = ">=3.19.2,<5.0.0"
pendulum = ">=2.1,<4"
packaging = ">=24.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3"
tox = "^4.67.15"
ruff = "^0.17.6"
singer-sdk = { version=">=0.54,<0.55", extras = ["testing"] }
types-simplejson = "^4.3.0.20261112"
types-setuptools = "^84.2.0.20261104"
pre-commit = "^4.7.0"

[tool.pytest.ini_options]
# Deprecated APIs fail the tests, so they get fixed before they are removed.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.ruff]
src = ["target_clickhouse"]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001", # missing-return-type
    "ANN201",  # missing-return-type-doc
    "CPY001", # Missing copyright notice at top of file
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D103", # Missing docstring in public function
    "D203", # One blank line before class docstring (conflicts with D211)
    "D213", # Summary on the second docstring line (conflicts with D212)
    "D401", # First line should be in imperative mood
    "D407", # Missing dashed underline after section
    "FA100", # Forbidden import
    "S101", # Use of assert detected
    "G004", # Logging statement uses string formatting
    "TC002",
    "TC003",
    "ANN202",
    "C901",
    "TRY201", # Use of bare 'except'
    "D417",
    "ANN003",
    "FBT001",
    "FBT002",
]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from their own fixed table names.
"tests/*" = ["S608"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["target_clickhouse"]

[tool.ruff.lint.pylint]
max-args = 6

[[tool.mypy.overrides]]
disable_error_code = ["name-defined"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
