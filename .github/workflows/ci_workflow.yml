name: Test target-clickhouse

on: [push]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      env:
        PIP_CONSTRAINT: .github/workflows/constraints.txt
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install

    - name: Run lint command from tox.ini
      run: |
        poetry run tox -e lint

  pytest:
    runs-on: ubuntu-latest
    services:
      clickhouse-server:
        image: clickhouse/clickhouse-server:23.4-alpine
        ports:
          - 18123:8123
          - 19000:9000
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8/3.9 are no longer available on ubuntu-latest runners.
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python '${{ matrix.python-version }}'
      uses: actions/setup-python@v5
      with:
        python-version: '${{ matrix.python-version }}'
    - name: Install Poetry
      env:
        PIP_CONSTRAINT: .github/workflows/constraints.txt
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    - name: Install dependencies
      run: |
        poetry install
    - name: Test with pytest
      run: |
        poetry run pytest --capture=no

  integration:
    runs-on: ubuntu-latest
    services:
      clickhouse-server:
        image: clickhouse/clickhouse-server:23.4-alpine
        ports:
          - 18123:8123
          - 19000:9000
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use the set-up interpreter so plugin venvs match the package's supported Python range.
        pipx install --python '${{ steps.setup-python.outputs.python-path }}' meltano
        meltano install
    - name: smoke-test-tap
      run: meltano run tap-smoke-test target-clickhouse
