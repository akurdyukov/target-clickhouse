name: Upload Python Package

# Publishing a GitHub release (tag vX.Y.Z) builds the package with the version
# taken from the tag, attaches the wheel to the release and uploads it to PyPI
# as akurdyukov-target-clickhouse. The upload uses PyPI trusted publishing:
# PyPI accepts this workflow, in the `pypi` environment, without a token.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the wheel to the release
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry "poetry-dynamic-versioning[plugin]"
    - name: Build package
      run: |
        poetry dynamic-versioning --no-cache
        poetry build
    - name: Check the version matches the tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        ls dist
        test -f "dist/akurdyukov_target_clickhouse-${TAG#v}-py3-none-any.whl"
    - name: Upload wheel to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: dist/*.whl
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/akurdyukov-target-clickhouse
    permissions:
      id-token: write  # trusted publishing
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
